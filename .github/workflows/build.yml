name: build

# Branch flow:  feature branch --PR--> dev (integration) --PR--> main (production)
# Every PR must compile on BOTH Windows and macOS, and every shader must be valid
# GLSL 410 -- so a Windows-only GL feature can't break the Mac build.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required on main: production only takes merges from dev.
  source-branch:
    name: PR source check
    runs-on: ubuntu-latest
    steps:
      - name: PRs into main must come from dev
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "::error::PRs into main must come from dev (got '${{ github.head_ref }}'). Open your PR against dev."
          exit 1
      - run: echo ok


  shaders:
    name: GLSL 410 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install glslang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools
      - name: Validate shaders (GLSL 410, #include expanded)
        run: python3 tools/check_shaders.py

  build:
    name: ${{ matrix.os }}
    needs: shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
          - os: macos-latest
            preset: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps/*-src
          key: deps-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test (CPU)
        run: ctest --preset ${{ matrix.preset }}
